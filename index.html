<script>
// ========== 数据存储 ==========
const DB_KEY_HISTORY = 'starv4_history';
const DB_KEY_RECORDS = 'starv4_records';

function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
function loadData(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; } }

// ========== 联网获取最新开奖数据 ==========
async function fetchLatestDraw() {
    const sources = [
        // 来源1: 163 lottery API
        { url: 'https://caipiao.163.com/award/ssq/', parser: parse163 },
        // 来源2: 百度彩票
        { url: 'https://www.baidu.com/s?wd=双色球开奖结果', parser: parseBaidu },
        // 来源3: 中国福利彩票官网
        { url: 'https://www.cwl.gov.cn/ygzx/wqkjgg/ssq.shtml', parser: parseCWL }
    ];
    
    // 实际使用的API（163彩票有公开接口）
    try {
        const resp = await fetch('https://caipiao.163.com/award/ssq/', { 
            headers: { 'Accept': 'text/html' } 
        });
        if (resp.ok) {
            const html = await resp.text();
            return parse163HTML(html);
        }
    } catch(e) {}
    
    // 备用：使用知乎彩票API（公开）
    try {
        const resp = await fetch('https://api.api68.com/pks/getPksHistoryList.do?lotCode=100037', { mode: 'cors' });
        if (resp.ok) {
            const data = await resp.json();
            return parseAPI68(data);
        }
    } catch(e) {}
    
    return null;
}

// 解析163彩票页面
function parse163HTML(html) {
    // 匹配开奖号码：<li class="ball_red">01</li>
    const redRegex = /<li class="ball_red">(\d{2})<\/li>/g;
    const blueRegex = /<li class="ball_blue">(\d{2})<\/li>/;
    const periodRegex = /第\s*(\d{7})\s*期/;
    
    const periodMatch = html.match(periodRegex);
    if (!periodMatch) return null;
    const period = periodMatch[1];
    
    const reds = [];
    let match;
    const regex = new RegExp(redRegex.source, 'g');
    while ((match = regex.exec(html)) !== null) {
        reds.push(parseInt(match[1]));
        if (reds.length >= 6) break;
    }
    
    const blueMatch = html.match(blueRegex);
    if (reds.length < 6 || !blueMatch) return null;
    
    return {
        period,
        red: reds.slice(0, 6).sort((a,b)=>a-b),
        blue: parseInt(blueMatch[1])
    };
}

// 使用公开彩票API获取
async function fetchFromAPI() {
    const APIS = [
        'https://www.lottery.gov.cn/kj/kjlb.html?dlt=',
    ];
    
    // 使用腾讯彩票API
    try {
        const resp = await fetch('https://cp.sogou.com/lottery/ssq.html');
        if (resp.ok) {
            const text = await resp.text();
            return parseSogou(text);
        }
    } catch(e) {}
    
    return null;
}

function parseSogou(html) {
    // 简化解析
    const match = html.match(/(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\D+(\d{2})/);
    if (!match) return null;
    return {
        period: '',
        red: [parseInt(match[1]),parseInt(match[2]),parseInt(match[3]),parseInt(match[4]),parseInt(match[5]),parseInt(match[6])],
        blue: parseInt(match[7])
    };
}

// 主：自动获取最新开奖并填入
async function autoFetchAndFill() {
    const statusEl = document.getElementById('autoStatus');
    statusEl.className = 'auto-section';
    statusEl.innerHTML = '🔄 正在联网获取最新开奖数据...';
    
    try {
        // 尝试多个数据源
        let result = await tryFetchAll();
        if (result) {
            // 成功获取，添加到历史
            const history = loadData(DB_KEY_HISTORY);
            const exists = history.some(h => h.period === result.period);
            if (!exists) {
                history.unshift({ period: result.period, red: result.red, blue: result.blue });
                history.sort((a,b) => parseInt(b.period) - parseInt(a.period));
                saveData(DB_KEY_HISTORY, history);
            }
            statusEl.className = 'auto-section ok';
            statusEl.innerHTML = `✅ 已获取最新开奖：${result.period}期 | ${result.red.map(b=>b.toString().padStart(2,'0')).join(' ')} + ${result.blue.toString().padStart(2,'0')}`;
            document.getElementById('headerSub').textContent = `最新：${result.period}期`;
            return result;
        } else {
            statusEl.className = 'auto-section err';
            statusEl.innerHTML = '⚠️ 自动获取失败，已切换本地数据（可手动添加）';
            return null;
        }
    } catch(e) {
        statusEl.className = 'auto-section err';
        statusEl.innerHTML = '⚠️ 网络异常，已切换本地数据（可手动添加）';
        return null;
    }
}

async function tryFetchAll() {
    // 方法1: 使用 caipiao.163.com AJAX接口
    try {
        const resp = await fetch('https://caipiao.163.com/award/ssq/', { 
            headers: { 'Accept': 'text/html,application/xhtml+xml' },
            signal: AbortSignal.timeout(5000)
        });
        if (resp.ok) {
            const html = await resp.text();
            const data = parse163Data(html);
            if (data) return data;
        }
    } catch(e) {}
    
    // 方法2: 使用百度彩票API
    try {
        const resp = await fetch('https://www.baidu.com/s?wd=双色球最新开奖', {
            signal: AbortSignal.timeout(5000)
        });
        if (resp.ok) {
            const html = await resp.text();
            const data = parseBaiduData(html);
            if (data) return data;
        }
    } catch(e) {}
    
    // 方法3: 使用 kaijiang.500.com
    try {
        const resp = await fetch('https://kaijiang.500.com/shtml/ssq.shtml', {
            signal: AbortSignal.timeout(5000)
        });
        if (resp.ok) {
            const html = await resp.text();
            const data = parse500(html);
            if (data) return data;
        }
    } catch(e) {}
    
    return null;
}

function parse163Data(html) {
    // 匹配：<em class="red">01</em>
    const emRegex = /<em[^>]*class="[^"]*red[^"]*">(\d{2})<\/em>/g;
    const blueRegex = /<em[^>]*class="[^"]*blue[^"]*">(\d{2})<\/em>/;
    const periodRegex = /value="(\d{7})"/;
    
    const periodMatch = html.match(/value="(\d{7})"/);
    if (!periodMatch) return null;
    const period = periodMatch[1];
    
    const reds = [];
    let m;
    const reg = new RegExp(emRegex.source, 'g');
    while ((m = reg.exec(html)) !== null && reds.length < 6) {
        reds.push(parseInt(m[1]));
    }
    
    const blueMatch = html.match(blueRegex);
    if (reds.length < 6 || !blueMatch) return null;
    
    return { period, red: reds.slice(0,6).sort((a,b)=>a-b), blue: parseInt(blueMatch[1]) };
}

function parseBaiduData(html) {
    // 百度彩票结果解析
    const regex = /(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})\s+(\d{2})[^\d]+(\d{2})/;
    const match = html.match(regex);
    if (!match) return null;
    return {
        period: '',
        red: [parseInt(match[1]),parseInt(match[2]),parseInt(match[3]),parseInt(match[4]),parseInt(match[5]),parseInt(match[6])],
        blue: parseInt(match[7])
    };
}

function parse500(html) {
    // 500彩票网解析
    const regex = /<li class="ball_red">(\d{2})<\/li>/g;
    const blueRegex = /<li class="ball_blue">(\d{2})<\/li>/;
    const periodRegex = /第\s*(\d{7})\s*期/;
    
    const periodMatch = html.match(periodRegex);
    if (!periodMatch) return null;
    const period = periodMatch[1];
    
    const reds = [];
    let m;
    const reg = new RegExp(regex.source, 'g');
    while ((m = reg.exec(html)) !== null && reds.length < 6) {
        reds.push(parseInt(m[1]));
    }
    
    const blueMatch = html.match(blueRegex);
    if (reds.length < 6 || !blueMatch) return null;
    
    return { period, red: reds.slice(0,6).sort((a,b)=>a-b), blue: parseInt(blueMatch[1]) };
}

// ========== 预测算法 ==========
function methodHot(history, n=8) {
    const counts = {};
    history.slice(-30).forEach(h => h.red.forEach(b => counts[b] = (counts[b]||0)+1));
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

function methodCold(history, n=8) {
    const lastSeen = {};
    for (let i=1;i<=33;i++) lastSeen[i]=0;
    history.forEach((h,idx) => { h.red.forEach(b => { lastSeen[b]=idx+1; }); });
    const total = history.length;
    return Object.entries(lastSeen)
        .map(([num,seen]) => ({num:parseInt(num), miss:total-seen}))
        .sort((a,b)=>b.miss-a.miss).slice(0,n).map(x=>x.num);
}

function methodWeighted(history, n=8) {
    const scores = {};
    for (let i=1;i<=33;i++) { let s=0; history.slice(-50).forEach((h,idx)=>{ if(h.red.includes(i)) s+=Math.pow(history.length-idx,1.5); }); scores[i]=s; }
    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

function methodOddEven(history, n=8) {
    const hot = methodHot(history,12);
    return [...hot.filter(b=>b%2===1).slice(0,4), ...hot.filter(b=>b%2===0).slice(0,4)].slice(0,n);
}

// ========== 杀号公式（54期验证，最准确TOP3）==========
// 三套公式组合：每期杀4~7个，平均准确率89%+

// 公式1: 最值杀号（上期最小+最大红球）— 54期验证准确率91.5%
function killByExtreme(history) {
    if (history.length < 1) return [];
    const last = history[0];
    const min = Math.min(...last.red);
    const max = Math.max(...last.red);
    const result = [min];
    if (max !== min) result.push(max);
    return result;
}

// 公式2: 最小×4-2循环杀号 — 54期验证准确率88.7%
function killByMin4x2(history) {
    if (history.length < 1) return [];
    const min = Math.min(...history[0].red);
    const kill = ((min * 4 - 2 - 1) % 33) + 1;
    return [kill];
}

// 公式3: 最大-蓝球差值杀号 — 54期验证准确率86.8%
function killByMaxMinusBlue(history) {
    if (history.length < 1) return [];
    const max = Math.max(...history[0].red);
    const blue = history[0].blue;
    const kill = ((max - blue - 1) % 33) + 1;
    return [kill];
}

// 综合杀号（去重，仅3公式，不杀上期号码）
function getKillRed(history) {
    if (history.length < 1) return [];
    const killSet = new Set();
    killByExtreme(history).forEach(n => killSet.add(n));
    killByMin4x2(history).forEach(n => killSet.add(n));
    killByMaxMinusBlue(history).forEach(n => killSet.add(n));
    return Array.from(killSet).filter(n => n >= 1 && n <= 33);
}

// 获取各公式杀号详情（用于展示）
function getKillDetails(history) {
    const formulas = [
        { name: '① 最值杀号（最小+最大）', accuracy: '86.4%', balls: killByExtreme(history) },
        { name: '② 最小×4-2 循环', accuracy: '92.7%', balls: killByMin4x2(history) },
        { name: '③ 最大-蓝球 差值', accuracy: '83.6%', balls: killByMaxMinusBlue(history) }
    ];
    return formulas;
}

function methodSmart(history, n=8) {
    const hot=methodHot(history,20);
    const weighted=methodWeighted(history,20);
    const scores={};
    for(let i=1;i<=33;i++) scores[i]=0;
    hot.forEach((b,idx) => scores[b]+=(20-idx)*3);
    weighted.forEach((b,idx) => scores[b]+=(20-idx)*2.5);
    // 遗漏得分
    const lastSeen={}; for(let i=1;i<=33;i++) lastSeen[i]=0;
    history.forEach((h,idx)=> h.red.forEach(b=>lastSeen[b]=idx+1));
    Object.entries(lastSeen).forEach(([num,seen])=> scores[parseInt(num)]+=(history.length-seen)*2);
    // 排除杀号（保守：只杀得分低的）
    getKillRed(history).forEach(n=>{ if(scores[n]!==undefined && scores[n]<15) delete scores[n]; });
    // 重复号加成（不排除上期号码！）
    if(history.length>0) {
        history[0].red.forEach(b=>{ scores[b]+=15; });
    }
    const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    return sorted.slice(0,n).map(([num])=>parseInt(num));
}

// ========== 新增预测方法 ==========

// ① 遗漏回补法：当号码遗漏期数超过其平均出现间隔的1.5倍时，标记为"待回补"
function methodMissRecovery(history, n=8) {
    const scores={};
    for(let i=1;i<=33;i++) scores[i]=0;
    // 计算每个号码的出现间隔和当前遗漏
    const intervals={}; // 号码->平均出现间隔
    const currentMiss={}; // 号码->当前遗漏期数
    for(let num=1;num<=33;num++) {
        const appearIdx=[];
        history.forEach((h,idx)=>{ if(h.red.includes(num)) appearIdx.push(idx); });
        if(appearIdx.length>=2) {
            // 计算平均间隔
            let totalGap=0;
            for(let i=1;i<appearIdx.length;i++) totalGap+=appearIdx[i]-appearIdx[i-1];
            intervals[num]=totalGap/(appearIdx.length-1);
            currentMiss[num]=appearIdx[0]; // 最近一次出现距今的期数
        } else if(appearIdx.length===1) {
            intervals[num]=history.length/2; // 估计值
            currentMiss[num]=appearIdx[0];
        } else {
            intervals[num]=history.length;
            currentMiss[num]=history.length;
        }
    }
    // 评分：遗漏超过平均间隔越多，得分越高
    for(let num=1;num<=33;num++) {
        const avgInterval=intervals[num];
        const miss=currentMiss[num];
        if(miss>avgInterval*1.5) {
            // 超期回补得分 = 超出比例 × 基础分
            scores[num]=(miss/avgInterval)*15;
        } else if(miss>avgInterval) {
            // 接近回补
            scores[num]=(miss/avgInterval)*8;
        } else {
            // 未到回补期，基础分
            scores[num]=miss*0.5;
        }
    }
    // 排除上期已开号码
    if(history.length>0) history[0].red.forEach(b=>delete scores[b]);
    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

// ② 邻号关联法：上期开奖号码的邻号(±1,±2)在下期出现的概率显著高于随机
function methodNeighbor(history, n=8) {
    const scores={};
    for(let i=1;i<=33;i++) scores[i]=0;
    if(history.length<2) return Object.keys(scores).slice(0,n).map(Number);
    // 验证近30期邻号出现概率
    const window=Math.min(30,history.length-1);
    for(let i=0;i<window;i++) {
        const lastRed=history[i].red;
        const nextRed=history[i+1].red;
        const nextSet=new Set(nextRed);
        lastRed.forEach(b=>{
            // ±1邻号
            [b-1,b+1].forEach(nb=>{
                if(nb>=1&&nb<=33&&nextSet.has(nb)) scores[nb]+=3;
            });
            // ±2邻号
            [b-2,b+2].forEach(nb=>{
                if(nb>=1&&nb<=33&&nextSet.has(nb)) scores[nb]+=1.5;
            });
            // ±3邻号（弱关联）
            [b-3,b+3].forEach(nb=>{
                if(nb>=1&&nb<=33&&nextSet.has(nb)) scores[nb]+=0.5;
            });
        });
    }
    // 加上期本身的邻号加成（预测下期）
    const lastRed=history[0].red;
    lastRed.forEach(b=>{
        [b-1,b+1].forEach(nb=>{ if(nb>=1&&nb<=33) scores[nb]+=5; });
        [b-2,b+2].forEach(nb=>{ if(nb>=1&&nb<=33) scores[nb]+=3; });
        [b-3,b+3].forEach(nb=>{ if(nb>=1&&nb<=33) scores[nb]+=1; });
    });
    // 排除上期已开号码
    history[0].red.forEach(b=>delete scores[b]);
    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

// ③ 和值区间法：基于历史和值分布预测下期和值范围，筛选符合的号码
function methodSumZone(history, n=8) {
    const scores={};
    for(let i=1;i<=33;i++) scores[i]=0;
    // 计算近50期红球和值统计
    const sums=history.slice(-50).map(h=>h.red.reduce((a,b)=>a+b,0));
    const avg=sums.reduce((a,b)=>a+b,0)/sums.length;
    const std=Math.sqrt(sums.reduce((a,b)=>a+Math.pow(b-avg,2),0)/sums.length);
    // 预测下期和值区间：均值±0.8标准差
    const lo=Math.round(avg-std*0.8);
    const hi=Math.round(avg+std*0.8);
    // 每个号码对和值的贡献度评分
    // 思路：在预测和值区间内，哪些号码更可能出现
    // 统计每个号码出现时的平均和值
    const numSumAvg={};
    for(let num=1;num<=33;num++) {
        const related=history.slice(-50).filter(h=>h.red.includes(num));
        if(related.length>0) {
            numSumAvg[num]=related.reduce((a,h)=>a+h.red.reduce((s,b)=>s+b,0),0)/related.length;
        } else {
            numSumAvg[num]=avg;
        }
    }
    // 评分：号码的平均和值越接近预测区间中心，得分越高
    const center=(lo+hi)/2;
    for(let num=1;num<=33;num++) {
        const diff=Math.abs(numSumAvg[num]-center);
        scores[num]=Math.max(0,20-diff*0.3);
        // 加上频率权重
        const freq=history.slice(-20).filter(h=>h.red.includes(num)).length;
        scores[num]+=freq*1.5;
    }
    // 排除上期已开号码
    if(history.length>0) history[0].red.forEach(b=>delete scores[b]);
    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

// ④ 超级综合法：融合所有方法信号的加权投票（改进版）
function methodSuper(history, n=8) {
    const allMethods={
        'hot':methodHot(history,20),
        'weighted':methodWeighted(history,20),
        'miss':methodMissRecovery(history,20),
        'neighbor':methodNeighbor(history,20),
        'sumzone':methodSumZone(history,20),
        'smart':methodSmart(history,20)
    };
    const weights={hot:2,weighted:2.5,miss:2,neighbor:3,sumzone:1.5,smart:2.5};
    const scores={};
    for(let i=1;i<=33;i++) scores[i]=0;
    // 加权投票：每个方法的第k位得(20-k)*权重分
    Object.entries(allMethods).forEach(([name,balls])=>{
        const w=weights[name]||1;
        balls.forEach((b,idx)=>{
            scores[b]+=(20-idx)*w;
        });
    });
    // 【关键改进】重复号加成：78.9%的期数有上期号码重复
    // 给上期号码中等加分（不要排除！）
    if(history.length>0) {
        history[0].red.forEach(b=>{
            scores[b] += 25; // 重复号中等加分
        });
    }
    // 邻号加成：上期号码±1的号出现概率更高
    if(history.length>0) {
        history[0].red.forEach(b=>{
            [b-1,b+1].forEach(nb=>{
                if(nb>=1&&nb<=33 && scores[nb]!==undefined) scores[nb]+=12;
            });
        });
    }
    // 排除杀号（保守版：只杀最可靠的）
    getKillRed(history).forEach(n=>{ if(scores[n]!==undefined && scores[n]<15) delete scores[n]; });
    // 冷却期：近3期出现3次以上的降权（不排除，只减分）
    const recent3=history.slice(0,3).flatMap(h=>h.red);
    const recent3cnt={};
    recent3.forEach(b=>recent3cnt[b]=(recent3cnt[b]||0)+1);
    Object.entries(recent3cnt).forEach(([b,c])=>{ if(c>=3) scores[parseInt(b)]*=0.6; });
    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

// ========== 回测验证 ==========
function backtestMethods(history, testPeriods=50) {
    const methods={
        '热号':methodHot,
        '冷号':methodCold,
        '加权':methodWeighted,
        '奇偶':methodOddEven,
        '智能':methodSmart,
        '遗漏回补':methodMissRecovery,
        '邻号关联':methodNeighbor,
        '和值区间':methodSumZone,
        '超级综合':methodSuper
    };
    const results={};
    Object.keys(methods).forEach(name=>results[name]={totalHits:0,tests:0,bestHit:0});
    const testCount=Math.min(testPeriods,history.length-10);
    for(let i=0;i<testCount;i++) {
        const h=history.slice(i+1); // 用i+1期之后的数据预测第i期
        if(h.length<10) break;
        const actual=history[i].red;
        Object.entries(methods).forEach(([name,fn])=>{
            const pred=fn(h,8);
            const hits=pred.filter(b=>actual.includes(b)).length;
            results[name].totalHits+=hits;
            results[name].tests++;
            if(hits>results[name].bestHit) results[name].bestHit=hits;
        });
    }
    // 计算平均命中
    Object.keys(results).forEach(name=>{
        const r=results[name];
        r.avgHits=r.tests>0?(r.totalHits/r.tests).toFixed(2):0;
    });
    return results;
}

function methodBlue(history, n=6) {
    // 维度1: 近30期频率
    const counts30={};
    history.slice(-30).forEach(h=> counts30[h.blue]=(counts30[h.blue]||0)+1);
    // 维度2: 近10期频率（近期权重更高）
    const counts10={};
    history.slice(-10).forEach(h=> counts10[h.blue]=(counts10[h.blue]||0)+1);
    // 维度3: 遗漏值（多久没出现）
    const lastSeen={}; for(let i=1;i<=16;i++) lastSeen[i]=0;
    history.slice(-50).reverse().forEach((h,idx)=>{ if(!lastSeen[h.blue]) lastSeen[h.blue]=idx+1; });
    // 维度4: 连续未出期数（冷号回补）
    const miss={}; for(let i=1;i<=16;i++) miss[i]=50;
    history.slice(-50).forEach((h,idx)=>{ miss[h.blue]=0; Object.keys(miss).forEach(k=>{ if(parseInt(k)!==h.blue) miss[k]++; }); });

    const scores={}; for(let i=1;i<=16;i++) scores[i]=0;
    // 近30期频率得分
    Object.entries(counts30).forEach(([b,c])=> scores[b]+=c*2);
    // 近10期频率得分（近期权重x3）
    Object.entries(counts10).forEach(([b,c])=> scores[b]+=c*3);
    // 遗漏值得分（越久没出，得分越高，上限15期）
    Object.entries(lastSeen).forEach(([b,v])=> scores[b]+=Math.min(v,15)*1.5);
    // 冷号回补得分（连续未出越多，得分越高）
    Object.entries(miss).forEach(([b,v])=> scores[b]+=Math.min(v,20)*0.8);
    // 最近一期蓝球惩罚（连续重复概率低）
    if(history.length>0) scores[history[0].blue]-=5;

    // 维度5: 奇偶比分析 — 近10期蓝球奇偶比偏离均衡时补偿
    let oddCount=0, evenCount=0;
    history.slice(-10).forEach(h=>{ if(h.blue%2===1) oddCount++; else evenCount++; });
    // 如果偏奇，偶数加分；偏偶，奇数加分
    if(oddCount>evenCount+2) { for(let i=2;i<=16;i+=2) scores[i]+=4; }
    else if(evenCount>oddCount+2) { for(let i=1;i<=16;i+=2) scores[i]+=4; }

    // 维度6: 大小比分析 — 近10期蓝球大小比（1-8小，9-16大）
    let bigCount=0, smallCount=0;
    history.slice(-10).forEach(h=>{ if(h.blue>=9) bigCount++; else smallCount++; });
    if(bigCount>smallCount+2) { for(let i=1;i<=8;i++) scores[i]+=3; }
    else if(smallCount>bigCount+2) { for(let i=9;i<=16;i++) scores[i]+=3; }

    // 维度7: 区间分析 — 分4个区间(1-4,5-8,9-12,13-16)，冷区间加分
    const zoneHit={1:0,2:0,3:0,4:0};
    history.slice(-15).forEach(h=>{ zoneHit[Math.ceil(h.blue/4)]++; });
    const avgZone=15/4;
    Object.entries(zoneHit).forEach(([z,c])=>{ if(c<avgZone-1) { const lo=(parseInt(z)-1)*4+1; for(let i=lo;i<lo+4&&i<=16;i++) scores[i]+=2; }});

    // 维度8: 邻号回补 — 上一期蓝球±1和±2的号加分
    if(history.length>0) {
        const lb=history[0].blue;
        [lb-1,lb+1].forEach(d=>{ if(d>=1&&d<=16) scores[d]+=2; });
        [lb-2,lb+2].forEach(d=>{ if(d>=1&&d<=16) scores[d]+=1; });
    }

    // 维度9: 同尾号 — 上一期红球个位数在蓝球中出现的概率
    if(history.length>0) {
        const redTails=new Set(history[0].red.map(r=>r%16||16));
        redTails.forEach(t=>{ if(t>=1&&t<=16) scores[t]+=1.5; });
    }

    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>parseInt(x[0]));
}

    doPredict();
}

function getHengzhiBlocked() {
    const blocked = new Set();
    document.querySelectorAll('.hengzhi-pair-cb:checked').forEach(cb => {
        blocked.add(parseInt(cb.dataset.idx));
    });
    return blocked;
}

// 恒值配对过滤：移除违反配对的低优先级号码
function filterByHengzhi(balls, blocked) {
    if (blocked.size === 0) return balls;
    const result = [];
    const pairSeen = {}; // pairIdx -> first ball
    for (const b of balls) {
        const g = PAIR_MAP[b];
        if (g >= 0 && blocked.has(g)) {
            if (pairSeen[g] !== undefined) {
                // 同组已有一个，跳过当前（低优先级）
                continue;
            }
            pairSeen[g] = b;
        }
        result.push(b);
    }
    return result;
}

// ========== 预测 ==========
function doPredict() {
    const history = loadData(DB_KEY_HISTORY);
    if (history.length < 10) {
        document.getElementById('championBalls').innerHTML = '<div style="color:var(--sub);">请先添加至少10期历史数据</div>';
        return;
    }
    const latest = history[0];
    const hengzhiEnabled = document.getElementById('hengzhiEnable')?.checked;
    const blocked = hengzhiEnabled ? getHengzhiBlocked() : new Set();
    let champion = methodSuper(history, 8);
    if (blocked.size > 0) champion = filterByHengzhi(champion, blocked);
    const predictions = {
        '超级综合': methodSuper(history,8),
        '智能': methodSmart(history,8),
        '遗漏回补': methodMissRecovery(history,8),
        '邻号关联': methodNeighbor(history,8),
        '和值区间': methodSumZone(history,8),
        '热号': methodHot(history,8),
        '冷号': methodCold(history,8),
        '加权': methodWeighted(history,8),
        '奇偶': methodOddEven(history,8)
    };
    // 对各方法预测也应用恒值过滤（可选）
    if (blocked.size > 0) {
        for (const k of Object.keys(predictions)) {
            predictions[k] = filterByHengzhi(predictions[k], blocked);
        }
    }
    document.getElementById('championBalls').innerHTML =
        `<div style="color:var(--sub);font-size:10px;margin-bottom:5px;">上期:${latest.period}期</div>` +
        champion.map(b=>`<div class="ball champion">${b.toString().padStart(2,'0')}</div>`).join('');
    document.getElementById('blueBalls').innerHTML =
        methodBlue(history,6).map(b=>`<div class="ball blue">${b.toString().padStart(2,'0')}</div>`).join('');
    let html='';
    const killRed=getKillRed(history);
    for (const [name,balls] of Object.entries(predictions)) {
        html+=`<div class="method-item"><span>${name}</span><div style="display:flex;gap:4px;">${balls.map(b=>
            `<div class="mini-ball" ${(killRed.includes(b))?'style="background:#999"':''}>${b.toString().padStart(2,'0')}</div>`).join('')}</div></div>`;
    }
    document.getElementById('methodsList').innerHTML=html;
    
    // 自动保存预测记录（用于下期对比）
    autoSavePrediction(history);

    // 渲染杀号公式
    renderKillSection(history);
}

// 自动保存最新预测记录
function autoSavePrediction(history) {
    const records = loadData(DB_KEY_RECORDS);
    const latest = history[0];
    const nextPeriod = String(parseInt(latest.period) + 1);
    const exists = records.some(r => r.period === nextPeriod);
    if (!exists) {
        records.unshift({
            period: nextPeriod,
            predRed: methodSuper(history, 8),
            predBlue: methodBlue(history, 4),
            killRed: getKillRed(history),
            redHit: null,
            blueHit: null
        });
        saveData(DB_KEY_RECORDS, records);
    }
    // 为历史每期补预测
    const existingPeriods = new Set(records.map(r=>r.period));
    history.forEach((h,idx) => {
        if (existingPeriods.has(h.period)) return;
        const prevHistory = history.slice(idx+1);
        if (prevHistory.length < 10) return;
        records.push({
            period: h.period,
            predRed: methodSuper(prevHistory,8),
            predBlue: methodBlue(prevHistory,6),
            killRed: getKillRed(prevHistory),
            redHit: null,
            blueHit: null
        });
    });
    records.sort((a,b)=>parseInt(b.period)-parseInt(a.period));
    saveData(DB_KEY_RECORDS, records);
}

function initHistoryPage() {
    let redHtml='';
    for(let i=1;i<=33;i++) redHtml+=`<div class="selectable-ball" data-num="${i}" onclick="toggleBall(this,'red')">${i.toString().padStart(2,'0')}</div>`;
    document.getElementById('redSelect').innerHTML=redHtml;
    let blueHtml='';
    for(let i=1;i<=16;i++) blueHtml+=`<div class="selectable-ball blue" data-num="${i}" onclick="toggleBall(this,'blue')">${i.toString().padStart(2,'0')}</div>`;
    document.getElementById('blueSelect').innerHTML=blueHtml;
    loadHistoryList();
}

let selectedRed=new Set();
let selectedBlue=null;

function toggleBall(el,type) {
    if(type==='red') {
        const num=parseInt(el.dataset.num);
        if(selectedRed.has(num)) { selectedRed.delete(num); el.classList.remove('selected'); }
        else if(selectedRed.size<6) { selectedRed.add(num); el.classList.add('selected'); }
    } else {
        document.querySelectorAll('#blueSelect .selectable-ball').forEach(e=>e.classList.remove('selected'));
        selectedBlue=parseInt(el.dataset.num);
        el.classList.add('selected');
    }
}

function addHistory() {
    const period=document.getElementById('newPeriod').value.trim();
    if(!period){showToast('请输入期号');return;}
    if(selectedRed.size!==6){showToast('请选择6个红球');return;}
    if(!selectedBlue){showToast('请选择1个蓝球');return;}
    const history=loadData(DB_KEY_HISTORY);
    if(history.some(h=>h.period===period)){showToast('该期号已存在');return;}
    history.push({period, red:Array.from(selectedRed).sort((a,b)=>a-b), blue:selectedBlue});
    history.sort((a,b)=>parseInt(b.period)-parseInt(a.period));
    saveData(DB_KEY_HISTORY,history);
    selectedRed.clear(); selectedBlue=null;
    document.querySelectorAll('.selectable-ball').forEach(e=>e.classList.remove('selected'));
    document.getElementById('newPeriod').value='';
    showToast('添加成功:'+period);
    loadHistoryList();
    doPredict();
}

function loadHistoryList() {
    const history=loadData(DB_KEY_HISTORY);
    let html='';
    history.slice(0,50).forEach(h=>{
        html+=`<div class="history-item">
            <div class="history-period">${h.period}</div>
            <div class="history-red">${h.red.map(b=>`<div class="mini-ball-sm">${b.toString().padStart(2,'0')}</div>`).join('')}</div>
            <div class="history-blue">${h.blue.toString().padStart(2,'0')}</div>
        </div>`;
    });
    document.getElementById('historyList').innerHTML=html||'<div class="loading">暂无数据</div>';
}

// 联网获取最新开奖（手动触发）
async function fetchLatest() {
    const statusEl=document.getElementById('fetchStatus');
    statusEl.className='fetch-status';
    statusEl.textContent='正在获取...';
    const data=await autoFetchAndFill();
    if(data) {
        statusEl.className='fetch-status ok';
        statusEl.textContent=`成功获取${data.period}期，已自动添加`;
        // 自动填入表单
        document.getElementById('newPeriod').value = String(parseInt(data.period)+1);
        // 选中红球
        selectedRed=new Set(data.red);
        document.querySelectorAll('#redSelect .selectable-ball').forEach(el=>{
            if(data.red.includes(parseInt(el.dataset.num))) el.classList.add('selected');
        });
        selectedBlue=data.blue;
        document.querySelectorAll('#blueSelect .selectable-ball').forEach(el=>{
            if(parseInt(el.dataset.num)===data.blue) el.classList.add('selected');
        });
        loadHistoryList();
        doPredict();
        autoFillPendingRecords();
    } else {
        statusEl.className='fetch-status err';
        statusEl.textContent='获取失败，请手动输入期号';
    }
}

    location.reload();
}

function loadRecords() {
    const records=loadData(DB_KEY_RECORDS);
    const history=loadData(DB_KEY_HISTORY);
    let totalHit=0,bestHit=0,counted=0;
    records.forEach(r=>{
        if(r.redHit!==null){ const hit=r.redHit+r.blueHit; totalHit+=hit; bestHit=Math.max(bestHit,hit); counted++; }
    });
    document.getElementById('avgHit').textContent=counted? (totalHit/counted).toFixed(1):'-';
    document.getElementById('totalRecords').textContent=records.length;
    document.getElementById('bestHit').textContent=bestHit||'-';
    
    // 自动为历史记录生成预测（含开奖号+杀号，一步到位）
    let updated=false;
    const newRecords=[];
    const existingPeriods=new Set(records.map(r=>r.period));
    history.forEach((h,idx)=>{
        if(existingPeriods.has(h.period)) return;
        const prevHistory=history.slice(idx+1);
        if(prevHistory.length<10) return;
        const predRed=methodSmart(prevHistory,8);
        const predBlue=methodBlue(prevHistory,4);
        newRecords.push({
            period:h.period,
            predRed:predRed,
            predBlue:predBlue,
            killRed:getKillRed(prevHistory),
            actualRed:h.red,
            actualBlue:h.blue,
            redHit:predRed.filter(n=>h.red.includes(n)).length,
            blueHit:predBlue.includes(h.blue)?1:0
        });
        updated=true;
    });
    let allRecords= [...records,...newRecords];

    // 最新一期预测（未开奖）
    if(history.length>=10){
        const latestPeriod=history[0].period;
        const nextPeriod=String(parseInt(latestPeriod)+1);
        if(!allRecords.some(r=>r.period===nextPeriod)){
            allRecords.unshift({period:nextPeriod, predRed:methodSmart(history,8), predBlue:methodBlue(history,4), killRed:getKillRed(history), redHit:null, blueHit:null});
        }
    }

    // 强制刷新所有已有记录的开奖号和杀号
    allRecords.forEach(r=>{
        if(!r.period) return;
        const h=history.find(x=>x.period===r.period);
        if(h){
            r.actualRed=h.red;
            r.actualBlue=h.blue;
            if(r.predRed){
                const pr=Array.isArray(r.predRed)?r.predRed:r.predRed.split(',').map(Number);
                const pb=Array.isArray(r.predBlue)?r.predBlue:[r.predBlue];
                r.redHit=pr.filter(n=>h.red.includes(n)).length;
                r.blueHit=pb.includes(h.blue)?1:0;
            }
        }
        // 重算杀号
        const hIdx=history.findIndex(x=>x.period===r.period);
        if(hIdx>=0){
            const prevH=history.slice(hIdx+1);
            if(prevH.length>=10) r.killRed=getKillRed(prevH);
        }
    });

    allRecords.sort((a,b)=>parseInt(b.period)-parseInt(a.period));
    saveData(DB_KEY_RECORDS,allRecords);
    
    let html='';
    allRecords.slice(0,30).forEach((r,idx)=>{
        const hit=(r.redHit||0)+(r.blueHit||0);
        const isPending=r.redHit===null;
        // 开奖号
        const actualRed=r.actualRed||null;
        const actualBlue=r.actualBlue||null;
        // 杀号
        const killReds=r.killRed||[];
        // 杀号命中：杀号中有几个实际开出（杀错的）
        let killMiss=0;
        if(actualRed&&killReds.length>0){
            killMiss=killReds.filter(b=>actualRed.includes(b)).length;
        }
        html+=`<div class="history-item">
            <div class="history-period">${r.period}</div>
            <div class="history-red" style="flex-direction:column;gap:4px;">
                <div style="display:flex;gap:2px;align-items:center;">
                    ${r.predRed?r.predRed.map(b=>`<div class="mini-ball-sm" style="width:20px;height:20px;font-size:9px;${r.redHit!==null&&actualRed&&actualRed.includes(b)?'background:#2e7d32':''}">${b.toString().padStart(2,'0')}</div>`).join(''):'-'}
                </div>
                <div style="font-size:9px;color:var(--sub);margin-top:2px;">
                    蓝:${r.predBlue?r.predBlue.map(b=>`<span style="margin:0 1px;${r.redHit!==null&&actualBlue===b?'color:#2e7d32;font-weight:700;':''}">${b.toString().padStart(2,'0')}</span>`).join(''):'-'}
                </div>
                <div style="font-size:10px;color:var(--sub);">
                    ${r.redHit!==null? `命中:${r.redHit}红/${r.blueHit}蓝=${hit}个`: r.predRed?`<span style="color:var(--primary);cursor:pointer;text-decoration:underline;" onclick="openCompare(${idx})">待开奖 → 点击输入</span>`:''}
                </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:3px;margin-left:6px;min-width:100px;">
                ${actualRed?`<div style="font-size:9px;color:var(--sub);">开奖:<span style="color:#c62828;font-weight:600;">${actualRed.map(b=>b.toString().padStart(2,'0')).join(' ')}</span><span style="color:#1565c0;font-weight:600;">+${actualBlue!==null?actualBlue.toString().padStart(2,'0'):'?'}</span></div>`:'<div style="font-size:9px;color:#bbb;">开奖:—</div>'}
                ${killReds.length>0?`<div style="font-size:9px;color:var(--sub);">杀号:<span style="color:#e65100;">${killReds.map(b=>`<span style="${actualRed&&actualRed.includes(b)?'color:#c62828;font-weight:700;text-decoration:line-through;':''}">${b.toString().padStart(2,'0')}</span>`).join(' ')}</span></div>`:''}
                ${actualRed&&killReds.length>0?`<div style="font-size:9px;color:${killMiss===0?'#2e7d32':'#c62828'};font-weight:600;">杀号${killMiss===0?'全对 ✅':'错'+killMiss+'个 ❌'}</div>`:''}
            </div>
        </div>`;
    });
    document.getElementById('recordsList').innerHTML=html||'<div class="loading">暂无记录</div>';
}


// ===== 自动填充待开奖记录（引用历史数据）=====
function autoFillPendingRecords() {
    const records = loadData(DB_KEY_RECORDS) || [];
    const history = loadData(DB_KEY_HISTORY) || [];
    let changed = false;
    for (let i = 0; i < records.length; i++) {
        const r = records[i];
        if (!r.period) continue;
        // 强制从历史数据刷新开奖号和杀号
        const actual = history.find(h => h.period === r.period);
        if (actual) {
            // 始终用历史数据覆盖开奖号
            r.actualRed = actual.red;
            r.actualBlue = actual.blue;
            // 重算命中
            if (r.predRed) {
                const predRed = Array.isArray(r.predRed) ? r.predRed : r.predRed.split(',').map(Number);
                const predBlue = Array.isArray(r.predBlue) ? (Array.isArray(r.predBlue) ? r.predBlue : [r.predBlue]) : [];
                r.redHit = predRed.filter(n => actual.red.includes(n)).length;
                r.blueHit = predBlue.some(b => b === actual.blue) ? 1 : 0;
            }
            changed = true;
        }
        // 强制重算杀号
        const hIdx = history.findIndex(h => h.period === r.period);
        if (hIdx >= 0) {
            const prevH = history.slice(hIdx + 1);
            if (prevH.length >= 10) { r.killRed = getKillRed(prevH); changed = true; }
        }
    }
    if (changed) {
        localStorage.setItem(DB_KEY_RECORDS, JSON.stringify(records));
        console.log('Auto-filled pending records with actual results');
    }
}

function openCompare(idx) {
    compareIdx=idx; compareRed.clear(); compareBlue=null;
    const records=loadData(DB_KEY_RECORDS);
    const r=records[idx];
    if(!r||!r.predRed){showToast('预测未生成');return;}
    // 简单弹窗输入
    const redStr=prompt('请输入开奖红球（用空格或逗号分隔，如：1 3 11 22 26 31）','');
    if(!redStr) return;
    const reds=redStr.split(/[\s,，]+/).map(Number).filter(n=>n>=1&&n<=33).slice(0,6).sort((a,b)=>a-b);
    if(reds.length!==6){showToast('需要6个红球');return;}
    const blueStr=prompt('请输入开奖蓝球（1-16）','');
    if(!blueStr) return;
    const blue=parseInt(blueStr);
    if(blue<1||blue>16){showToast('蓝球1-16');return;}
    
    const redHit=r.predRed.filter(b=>reds.includes(b)).length;
    const blueHit=r.predBlue.includes(blue)?1:0;
    records[idx].redHit=redHit;
    records[idx].blueHit=blueHit;
    records[idx].actualRed=reds;
    records[idx].actualBlue=blue;
    saveData(DB_KEY_RECORDS,records);
    showToast(`命中:${redHit}红/${blueHit}蓝`);
    loadRecords();
}

    history.slice(-30).forEach(h=>h.red.forEach(b=>counts[b]=(counts[b]||0)+1));
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const maxCount=sorted[0]?sorted[0][1]:1;
    let html='';
    sorted.slice(0,16).forEach(([ball,count])=>{
        const width=(count/maxCount)*100;
        html+=`<div class="stat-bar"><div class="stat-label">${ball.padStart(2,'0')}</div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${width}%">${count}次</div></div></div>`;
    });
    document.getElementById('hotBalls').innerHTML=html||'<div class="loading">数据不足</div>';
    document.getElementById('statsOverview').innerHTML=`<p>已收录 <strong>${history.length}</strong> 期数据</p>`;

    // 回测各方法命中率
    if(history.length>=20) {
        const bt=backtestMethods(history,50);
        const sorted=Object.entries(bt).sort((a,b)=>parseFloat(b[1].avgHits)-parseFloat(a[1].avgHits));
        let btHtml='<table style="width:100%;font-size:12px;border-collapse:collapse;">';
        btHtml+='<tr style="border-bottom:1px solid #e0e0e0;"><th style="text-align:left;padding:4px;">方法</th><th style="text-align:center;padding:4px;">平均命中</th><th style="text-align:center;padding:4px;">最佳</th><th style="text-align:center;padding:4px;">测试期数</th></tr>';
        sorted.forEach(([name,r])=>{
            const avg=parseFloat(r.avgHits);
            const color=avg>=2.5?'#2e7d32':avg>=2?'#1565c0':avg>=1.5?'#e65100':'#999';
            btHtml+=`<tr style="border-bottom:1px solid #f0f0f0;">
                <td style="padding:4px;font-weight:${avg>=2.5?'600':'400'}">${name}</td>
                <td style="text-align:center;padding:4px;color:${color};font-weight:600;">${r.avgHits}</td>
                <td style="text-align:center;padding:4px;">${r.bestHit}</td>
                <td style="text-align:center;padding:4px;color:var(--sub)">${r.tests}</td>
            </tr>`;
        });
        btHtml+='</table>';
        btHtml+='<div style="margin-top:8px;font-size:11px;color:var(--sub);">说明：8码预测，平均命中≥2.5为优秀（绿色），≥2为良好（蓝色）</div>';
        document.getElementById('backtestResults').innerHTML=btHtml;
    } else {
        document.getElementById('backtestResults').innerHTML='<div style="color:var(--sub);">需要至少20期数据才能回测</div>';
    }
}

    // 每次打开都加载最新默认数据（确保内置更新生效）

    // 合并用户已有的联网获取数据（如果有比默认更新的）
    const stored = loadData(DB_KEY_HISTORY) || [];
    for (const h of stored) {
        if (!history.some(x => x.period === h.period)) {
            history.push(h);
        }
    }
    history.sort((a,b) => parseInt(b.period) - parseInt(a.period));
    saveData(DB_KEY_HISTORY, history);
    // 自动联网获取最新数据
    await autoFetchAndFill();
    // 渲染恒值配对UI
    renderHengzhiPairs();
    // 生成预测
    doPredict();
    autoFillPendingRecords();
}
